  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <header>
    <h1>Let’s Connect!</h1>
    <p>I’d love to hear from you. Feel free to reach out with questions or collaboration ideas.</p>
    <!-- Envelope icon -->
    <div class="envelope-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 24 24">
        <path d="M2 4h20v16H2V4zm2 2v.01L12 13l8-7v-.01H4z"/>
      </svg>
    </div>
  </header>

  <section id="contact">
    <h2>Get in Touch</h2>
    <form action="mailto:your.email@example.com" method="post" enctype="text/plain">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />

      <label for="reason">Reason for reaching out:</label>
      <select id="reason" name="reason">
        <option value="collaboration">Collaboration</option>
        <option value="feedback">Feedback on site</option>
        <option value="mentoring">Mentoring or support</option>
        <option value="just-saying-hi">Just saying hi</option>
      </select>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Send</button>
    </form>
  </section>

  <footer>
    <p>© 2025 Layla Shalash | <a href="Resume.pdf" download>Download Resume</a> | <a href="contact.html">Contact</a></p>
  </footer>
</body>
</html>
